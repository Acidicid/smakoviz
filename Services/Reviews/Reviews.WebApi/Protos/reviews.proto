// gRPC-контракт сервісу «Відгуки» (Лаб. 06). Номери полів після публікації не змінюються.
syntax = "proto3";

option csharp_namespace = "Reviews.Grpc";

package smakoviz.reviews.v1;

import "google/protobuf/timestamp.proto";

// Читання відгуків і рейтингів для внутрішніх сервісів (Aggregator).
service ReviewsService {
  // Середня оцінка ресторану (aggregation pipeline MongoDB). INVALID_ARGUMENT — restaurant_id <= 0.
  rpc GetRestaurantRating (GetRestaurantRatingRequest) returns (RestaurantRatingReply);
  // Відгуки ресторану (новіші спершу), за бажанням — лише одного клієнта.
  rpc ListReviews (ListReviewsRequest) returns (ReviewsReply);
}

message GetRestaurantRatingRequest {
  int64 restaurant_id = 1;
}

message RestaurantRatingReply {
  int64 restaurant_id = 1;
  int32 reviews_count = 2;
  double average_rating = 3;
}

message ListReviewsRequest {
  int64 restaurant_id = 1;
  // якщо задано — лише відгуки цього клієнта
  optional int64 customer_id = 2;
  // 1..50
  int32 page_size = 3;
}

message Review {
  string id = 1;
  // restaurant | dish | courier
  string target_type = 2;
  int64 restaurant_id = 3;
  optional int64 dish_id = 4;
  optional string dish_name = 5;
  string author_name = 6;
  int32 rating = 7;
  optional string text = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ReviewsReply {
  repeated Review reviews = 1;
  int64 total_count = 2;
}
